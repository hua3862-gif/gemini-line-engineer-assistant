name: run-alert

on:
  schedule:
    # 台灣時間每天早上 9:00 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests line-bot-sdk google-genai flask

      - name: Run check_alert.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PROGRESS_DB_ID: ${{ secrets.PROGRESS_DB_ID }}
          REPLY_DB_ID: ${{ secrets.REPLY_DB_ID }}
          ALERT_GROUP_ID: ${{ secrets.ALERT_GROUP_ID }}
        run: |
          python check_alert.py
